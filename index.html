// دالة تنسيق النص القانوني

function formatDec(tmpl, r) {
  if (!tmpl) return '';
  return tmpl
    .replace('{name}', r.receiver_name || r.receiverName || '')
    .replace('{id}', r.receiver_id || r.receiverId || '---')
    .replace('{shop}', r.shop_name || r.shopName || 'هيبة الاسترخاء')
    .replace('{amount}', r.amount || '')
    .replace('{curr}', r.currency || '')
    .replace('{reason}', r.reason || '')
    .replace('{method}', r.method || '')
    .replace('{date}', r.date || '');
}

// ============================================
// مكون لوحة التوقيع - يدعم اللمس والماوس
// ============================================
function SignaturePad({ onSave }) {
  const canvasRef = useRef(null);
  const [isDrawing, setIsDrawing] = useState(false);
  const [hasDrawn, setHasDrawn] = useState(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
      };
    };

    const start = (e) => {
      setIsDrawing(true);
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      setHasDrawn(true);
    };

    const move = (e) => {
      if (!isDrawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    };

    const end = () => {
      setIsDrawing(false);
    };

    // أحداث الماوس
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);

    // أحداث اللمس للجوال
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      start(e);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      move(e);
    }, { passive: false });
    
    canvas.addEventListener('touchend', end);

    return () => {
      canvas.removeEventListener('mousedown', start);
      canvas.removeEventListener('mousemove', move);
      canvas.removeEventListener('mouseup', end);
      canvas.removeEventListener('mouseleave', end);
    };
  }, [isDrawing]);

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    onSave('');
    setHasDrawn(false);
  };

  const save = () => {
    const canvas = canvasRef.current;
    const data = canvas.toDataURL();
    if (data.length < 1500) {
      alert('⚠️ من فضلك وقع أولاً قبل الحفظ');
      return;
    }
    onSave(data);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width="600"
        height="200"
        className="sig-canvas w-full"
      ></canvas>
      <div className="flex gap-2 mt-3">
        <button
          onClick={clear}
          className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold transition"
        >
          🗑️ مسح التوقيع
        </button>
        <button
          onClick={save}
          className="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-sm font-bold transition"
        >
          💾 حفظ التوقيع
        </button>
        {hasDrawn && (
          <span className="text-xs text-emerald-600 flex items-center mr-3 font-bold">
            ✅ تم الرسم - اضغط حفظ
          </span>
        )}
      </div>
    </div>
  );
}

  function handleEvidence(e, recId) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (ev) => {
      setTemp(prev => ({
        ...prev,
        [recId]: { ...prev[recId], evidence: ev.target.result }
      }));
    };
    reader.readAsDataURL(file);
  }

  // تأكيد استلام الإيصال من الموظف
  async function confirmReceipt(recId) {
    const t = temp[recId];
    
    if (!t?.checked) {
      alert('⚠️ يجب الموافقة على الإقرار القانوني');
      return;
    }
    
    if (!t?.evidence) {
      alert('⚠️ يجب تصوير إثبات الاستلام');
      return;
    }
    
    if (!t?.signature) {
      alert('⚠️ يجب التوقيع وحفظ التوقيع');
      return;
    }

    try {
      const { error } = await supabase
        .from('receipts')
        .update({
          status: 'confirmed',
          confirmed_at: new Date().toISOString(),
          evidence_url: t.evidence,
          signature_url: t.signature
        })
        .eq('id', recId);

      if (error) {
        alert('خطأ: ' + error.message);
        return;
      }

      setReceipts(prev => prev.map(r =>
        r.id === recId
          ? {
              ...r,
              status: 'confirmed',
              evidence_url: t.evidence,
              signature_url: t.signature,
              confirmed_at: new Date().toISOString()
            }
          : r
      ));
      
      alert('✅ تم تأكيد الاستلام بنجاح - تم حفظ الوثيقة القانونية');

              const t = temp[r.id] || {};
              return (
                <div key={r.id} className="bg-white p-6 rounded-[24px] border-2 border-amber-200 shadow-[0_10px_40px_rgba(245,158,11,.15)] mb-6 card-hover">
                  <div className="flex justify-between items-start mb-4">
                    <div><div className="font-black text-slate-800">هيبة الاسترخاء للخدمات</div><div className="text-xs text-slate-500 font-bold mt-1">إيصال صرف رقم {r.id}</div></div>
                    <div className="px-3 py-1.5 gradient-amber text-white rounded-full text-xs font-black shadow-md">⏳ {T.ar.pending}</div>
                  </div>
                  <div className="bg-gradient-to-br from-slate-50 to-white p-5 rounded-2xl border-2 border-slate-100 mb-5">
                    <div className="text-[11px] font-black tracking-widest text-slate-400">المبلغ المستحق</div>
                    <div className="text-4xl font-black text-teal-700 mt-1 tracking-tight">{r.amount?.toLocaleString()} <span className="text-lg font-bold text-slate-600">{r.currency}</span></div>
                    <div className="mt-3 grid grid-cols-3 gap-3 text-xs">
                      <div className="bg-white p-2.5 rounded-xl border"><div className="text-slate-400 font-bold">المقابل</div><div className="font-black mt-0.5">{r.reason}</div></div>
                      <div className="bg-white p-2.5 rounded-xl border"><div className="text-slate-400 font-bold">الطريقة</div><div className="font-black mt-0.5">{r.method}</div></div>
                      <div className="bg-white p-2.5 rounded-xl border"><div className="text-slate-400 font-bold">التاريخ</div><div className="font-black mt-0.5">{r.date}</div></div>
                    </div>
                  </div>
                  <div className="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl">
                    <label className="flex gap-3 cursor-pointer group"><input type="checkbox" className="w-5 h-5 rounded-lg" onChange={e => setTemp(prev => ({ ...prev, [r.id]: { ...prev[r.id], checked: e.target.checked } }))}/><span className="font-black text-[13px] group-hover:text-amber-800 transition">{tr.ack}</span></label>
                    <div className="mt-3 p-4 bg-white rounded-xl border-2 border-amber-100 text-[13px] leading-7 font-bold">{decLang}</div>
                    <div className="mt-2 p-3 bg-slate-50 rounded-xl text-[11px] text-slate-500 leading-6">🇸🇦 AR: {decAr}</div>
                  </div>
                  <div className="mt-6 space-y-5">
                    <div><label className="font-black text-sm flex items-center gap-2"><span className="w-7 h-7 bg-slate-900 text-white rounded-lg flex items-center justify-center text-xs">1</span>{tr.proof}</label><input type="file" accept="image/*" capture="environment" onChange={e => handleEvidence(e, r.id)} className="w-full p-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl mt-3 focus:border-teal-500 outline-none"/><div className="mt-3">{t.evidence && <div className="relative"><img src={t.evidence} className="w-full max-h-72 object-contain border-2 border-emerald-200 rounded-2xl bg-emerald-50/50"/><div className="absolute top-3 right-3 px-3 py-1 bg-emerald-500 text-white rounded-full text-xs font-black">✅ تم الرفع</div></div>}</div></div>
                    <div><label className="font-black text-sm flex items-center gap-2"><span className="w-7 h-7 bg-slate-900 text-white rounded-lg flex items-center justify-center text-xs">2</span>{tr.sign}</label><div className="mt-3"><SignaturePad onSave={(sig) => setTemp(prev => ({ ...prev, [r.id]: { ...prev[r.id], signature: sig } }))}/>{t.signature && <div className="mt-2 text-xs font-black text-emerald-600 bg-emerald-50 p-2 rounded-xl">✅ تم حفظ التوقيع بنجاح</div>}</div></div>
                  </div>
                  <button disabled={!(t.checked && t.evidence && t.signature)} onClick={() => confirmReceipt(r.id)} className="w-full gradient-teal text-white p-5 rounded-2xl mt-6 font-black text-[16px] shadow-xl shadow-teal-500/20 hover:shadow-2xl hover:shadow-teal-500/30 transition-all hover:-translate-y-1 disabled:opacity-40 disabled:translate-y-0 disabled:shadow-none">{tr.confirm} ✅</button>
                </div>
              );
            })}
          </div>
        )}

        <div>
          <div className="flex items-center gap-3 mb-5">
            <div className="w-10 h-10 gradient-emerald rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">📊</div>
            <div><h3 className="font-black text-lg">{tr.history}</h3><p className="text-xs text-slate-500 font-bold">{confirmed.length} إيصال مؤكد • {myRecs.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0).toLocaleString()} {confirmed[0]?.currency || 'ريال'} إجمالي</p></div>
          </div>
          <div className="bg-white rounded-[24px] border border-slate-100 shadow-sm overflow-hidden">
            <div className="p-5 border-b bg-slate-50/50 flex justify-between items-center"><h4 className="font-black text-sm">سجل الاستلامات المفصل - جدول واحد فيه المؤكد وغير المؤكد مع التعديل</h4><span className="text-xs bg-slate-900 text-white px-3 py-1 rounded-full font-bold">{myRecs.length} سجل</span></div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-slate-50/80 text-[11px] font-black tracking-widest text-slate-500"><th className="p-4 text-right">رقم الإيصال</th><th className="p-4 text-right">المبلغ</th><th className="p-4 text-right">السبب</th><th className="p-4 text-right">التاريخ</th><th className="p-4 text-right">الحالة</th><th className="p-4 text-right">الوثيقة</th></tr></thead>
                <tbody>
                  {myRecs.length === 0 ? <tr><td colSpan="6" className="p-16 text-center"><div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">📭</div><div className="font-black text-slate-800">{tr.noPending}</div></td></tr> :
                    myRecs.map(r => (
                      <tr key={r.id} className="border-t border-slate-50 hover:bg-slate-50/80 transition group">
                        <td className="p-4"><div className="font-mono text-xs font-black bg-slate-100 px-2.5 py-1 rounded-full inline-block group-hover:bg-slate-900 group-hover:text-white transition">{r.id}</div></td>
                        <td className="p-4"><div className="font-black text-teal-700 text-[15px]">{r.amount?.toLocaleString()} <span className="text-xs text-slate-500">{r.currency}</span></div></td>
                        <td className="p-4"><div className="font-bold text-[13px]">{r.reason}</div><div className="text-[11px] text-slate-500 font-bold">{r.method}</div></td>
                        <td className="p-4 text-xs font-bold text-slate-600">{r.date}</td>
                        <td className="p-4">{r.status === 'pending' ? <span className="px-3 py-1 gradient-amber text-white rounded-full text-[11px] font-black shadow-sm">⏳ معلق</span> : <span className="px-3 py-1 gradient-emerald text-white rounded-full text-[11px] font-black shadow-sm">✅ مؤكد</span>}</td>
                        <td className="p-4"><button onClick={() => setViewDocRec(r)} className="px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-xl text-xs font-black shadow-md hover:shadow-lg transition-all hover:-translate-y-0.5">👁️ {tr.view}</button></td>
                      </tr>
                    ))
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      {viewDocRec && (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) setViewDocRec(null); }}>
          <div className="bg-white max-w-3xl w-full rounded-[24px] overflow-hidden shadow-[0_25px_80px_rgba(0,0,0,.3)] max-h-[92vh] overflow-y-auto">
            <div id="printable-doc" className="p-8 bg-white">
              <div className="text-center border-b-2 border-slate-900 pb-6 mb-6">
                <div className="w-16 h-16 gradient-teal rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg text-xl">📜</div>
                <h2 className="text-2xl font-black tracking-tight">{T[viewDocRec.language || lang]?.docTitle || 'إقرار استلام'}</h2>
                <div className="mt-3 flex justify-center gap-2">
                  <span className="font-mono text-xs bg-slate-900 text-white px-4 py-1.5 rounded-full font-bold">{viewDocRec.id}</span>
                  <span className="text-xs bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full font-black">{viewDocRec.language?.toUpperCase()}</span>
                </div>
              </div>
              <div className="bg-gradient-to-br from-teal-50 to-cyan-50 p-5 rounded-2xl border-2 border-teal-100 mb-4">
                <div className="font-black text-sm mb-3">🌐 النص بلغته:</div>
                <div className="text-[15px] leading-8 font-bold bg-white p-4 rounded-xl border border-teal-100">{formatDec(T[viewDocRec.language || 'ar']?.dec || T.ar.dec, viewDocRec)}</div>
              </div>
              <div className="bg-slate-50 p-5 rounded-2xl border-2 border-slate-200 mb-6">
                <div className="font-black text-sm mb-3">🇸🇦 النص العربي:</div>
                <div className="text-[13px] leading-8 font-bold text-slate-700 bg-white p-4 rounded-xl border">{formatDec(T.ar.dec, viewDocRec)}</div>
              </div>
              <div className="grid grid-cols-2 gap-4 mb-6">
                <div className="bg-white border-2 border-slate-100 rounded-2xl p-4">
                  <div className="text-xs font-black mb-3">✍️ التوقيع:</div>
                  {viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border-2 border-slate-100 rounded-xl h-32 object-contain bg-slate-50"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}
                </div>
                <div className="bg-white border-2 border-slate-100 rounded-2xl p-4">
                  <div className="text-xs font-black mb-3">📸 الإثبات:</div>
                  {viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border-2 border-slate-100 rounded-xl h-32 object-contain bg-slate-50"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}
                </div>
              </div>
            </div>
            <div className="p-5 bg-slate-50 border-t-2 border-slate-100 flex gap-3 no-print">
              <button onClick={() => window.print()} className="flex-1 bg-slate-900 hover:bg-black text-white p-4 rounded-xl font-black shadow-lg">🖨️ {tr.print}</button>
              <button onClick={() => setViewDocRec(null)} className="flex-1 bg-white border-2 border-slate-200 hover:bg-slate-50 p-4 rounded-xl font-black transition">إغلاق ✕</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
