function formatDec(tmpl,r){
  if(!tmpl) return '';
  return tmpl.replace('{name}',r.receiver_name||r.receiverName||'').replace('{id}',r.receiver_id||r.receiverId||'---').replace('{shop}',r.shop_name||r.shopName||'هيبة الاسترخاء').replace('{amount}',r.amount||'').replace('{curr}',r.currency||'').replace('{reason}',r.reason||'').replace('{method}',r.method||'').replace('{date}',r.date||'');
}

function SignaturePad({onSave}){
  const canvasRef=useRef(null);
  const [isDrawing,setIsDrawing]=useState(false);
  const [hasSignature, setHasSignature] = useState(false);
  useEffect(()=>{
    const c=canvasRef.current; if(!c) return;
    const ctx=c.getContext('2d'); ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
    const getPos=(e)=>{const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left, y:t.clientY-rect.top};};
    const start=(e)=>{setIsDrawing(true); const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); setHasSignature(true);};
    const move=(e)=>{if(!isDrawing)return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke();};
    const end=()=>setIsDrawing(false);
    c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); c.addEventListener('mouseup',end);
    c.addEventListener('touchstart',(e)=>{e.preventDefault(); start(e)},{passive:false});
    c.addEventListener('touchmove',(e)=>{e.preventDefault(); move(e)},{passive:false});
    c.addEventListener('touchend',end);
    return ()=>{c.removeEventListener('mousedown',start); c.removeEventListener('mousemove',move); c.removeEventListener('mouseup',end);};
  },[isDrawing]);
  const clear=()=>{const c=canvasRef.current; c.getContext('2d').clearRect(0,0,c.width,c.height); onSave(''); setHasSignature(false);};
  const save=()=>{const data=canvasRef.current.toDataURL(); if(data.length<1500){alert('من فضلك وقع أولاً');return;} onSave(data);};
  return (
    <div>
      <canvas ref={canvasRef} width="600" height="180" className="sig-canvas w-full"></canvas>
      <div className="flex gap-2 mt-3">
        <button onClick={clear} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold transition">🗑️ مسح التوقيع</button>
        <button onClick={save} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-sm font-bold transition">💾 حفظ التوقيع</button>
        {hasSignature && <span className="text-xs text-emerald-600 flex items-center mr-2">✅ تم الرسم - اضغط حفظ</span>}
      </div>
    </div>
  );
}

n onClick={()=>deleteReceipt(r.id)} className="px-2 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold transition">🗑️</button></td></tr>);})}</tbody></table></div>

                    confirmed.map(r=>(
                      <tr key={r.id} className="border-t border-slate-50 hover:bg-slate-50/80 transition group">
                        <td className="p-4"><div className="font-mono text-xs font-black bg-slate-100 px-2.5 py-1 rounded-full inline-block group-hover:bg-slate-900 group-hover:text-white transition">{r.id}</div></td>
                        <td className="p-4"><div className="font-black text-teal-700 text-[15px]">{r.amount?.toLocaleString()} <span className="text-xs text-slate-500">{r.currency}</span></div></td>
                        <td className="p-4"><div className="font-bold text-[13px]">{r.reason}</div><div className="text-[11px] text-slate-500 font-bold">{r.method}</div></td>
                        <td className="p-4 text-xs font-bold text-slate-600">{r.date}<div className="text-[10px] text-slate-400">{r.confirmed_at ? new Date(r.confirmed_at).toLocaleDateString('ar-EG') : ''}</div></td>
                        <td className="p-4"><span className="px-3 py-1.5 gradient-emerald text-white rounded-full text-[11px] font-black shadow-sm">✅ مؤكد</span></td>
                        <td className="p-4"><button onClick={()=>{setViewDocRec(r); document.getElementById('modal').style.display='flex';}} className="px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-xl text-xs font-black shadow-md hover:shadow-lg transition-all hover:-translate-y-0.5">👁️ {tr.view}</button></td>
                      </tr>
                    ))
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      {viewDocRec && (
        <div className="bg-white max-w-3xl w-full rounded-[24px] overflow-hidden shadow-[0_25px_80px_rgba(0,0,0,.3)] max-h-[92vh] overflow-y-auto">
          <div id="printable-doc" className="p-8">
            <div className="text-center border-b-2 border-slate-900 pb-6 mb-6 relative">
              <div className="absolute top-0 left-0 w-20 h-20 bg-gradient-to-br from-teal-500 to-cyan-500 rounded-full blur-2xl opacity-20"></div>
              <div className="w-16 h-16 gradient-teal rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">📜</div>
              <h2 className="text-2xl font-black tracking-tight">{T[viewDocRec.language||lang]?.docTitle||T.ar.docTitle||'إقرار استلام'}</h2>
              <div className="mt-3 flex justify-center gap-2"><span className="font-mono text-xs bg-slate-900 text-white px-4 py-1.5 rounded-full font-bold">{viewDocRec.id}</span><span className="text-xs bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full font-black">{viewDocRec.language?.toUpperCase()}</span></div>
              <div className="mt-2 text-xs font-bold text-slate-500">هيبة الاسترخاء للخدمات • وثيقة رسمية معتبرة قانوناً</div>
            </div>

            <div className="bg-gradient-to-br from-teal-50 to-cyan-50 p-5 rounded-2xl border-2 border-teal-100 mb-4">
              <div className="font-black text-sm mb-3 flex items-center gap-2"><span className="w-6 h-6 bg-teal-600 text-white rounded-lg flex items-center justify-center text-xs">🌐</span>{viewDocRec.language==='id'?'Bahasa Indonesia':viewDocRec.language==='tl'?'Filipino':viewDocRec.language==='bn'?'Bengali':'العربية'} - النص بلغته:</div>
              <div className="text-[15px] leading-8 font-bold bg-white p-4 rounded-xl border border-teal-100">{formatDec(T[viewDocRec.language||'ar']?.dec||T.ar.dec, viewDocRec)}</div>
            </div>

            <div className="bg-slate-50 p-5 rounded-2xl border-2 border-slate-200 mb-6">
              <div className="font-black text-sm mb-3 flex items-center gap-2"><span className="w-6 h-6 bg-slate-900 text-white rounded-lg flex items-center justify-center text-xs">🇸🇦</span>النص القانوني الأصلي (عربي):</div>
              <div className="text-[13px] leading-8 font-bold text-slate-700 bg-white p-4 rounded-xl border">{formatDec(T.ar.dec, viewDocRec)}</div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div className="space-y-3">
                <div className="bg-white border-2 border-slate-100 p-4 rounded-2xl"><div className="text-[11px] font-black tracking-widest text-slate-400">المستلم</div><div className="font-black mt-1">{viewDocRec.receiver_name}</div><div className="text-xs text-slate-500 font-bold">@{viewDocRec.receiver_username} • {viewDocRec.receiver_id||'---'}</div></div>
                <div className="bg-white border-2 border-slate-100 p-4 rounded-2xl"><div className="text-[11px] font-black tracking-widest text-slate-400">المبلغ الإجمالي</div><div className="font-black text-2xl text-teal-700 mt-1">{viewDocRec.amount?.toLocaleString()} <span className="text-sm text-slate-600">{viewDocRec.currency}</span></div></div>
              </div>
              <div className="space-y-3">
                <div className="bg-white border-2 border-slate-100 p-4 rounded-2xl"><div className="text-[11px] font-black tracking-widest text-slate-400">المقابل والطريقة</div><div className="font-bold mt-1 text-sm">{viewDocRec.reason}</div><div className="text-xs text-slate-500 font-bold mt-1">{viewDocRec.method} • {viewDocRec.date}</div>{viewDocRec.notes && <div className="text-xs bg-amber-50 p-2 rounded-lg mt-2 border border-amber-100">📌 {viewDocRec.notes}</div>}</div>
                <div className="bg-slate-900 text-white p-4 rounded-2xl"><div className="text-[11px] font-black tracking-widest text-slate-400">رقم التوثيق القانوني</div><div className="font-mono font-black mt-1">{viewDocRec.id}</div><div className="text-[10px] text-slate-400 mt-1">موثق إلكترونياً بتوقيع وصورة</div></div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4 mb-6">
              <div className="bg-white border-2 border-slate-100 rounded-2xl p-4"><div className="text-xs font-black mb-3 flex items-center gap-2"><span className="w-6 h-6 bg-slate-900 text-white rounded-lg flex items-center justify-center">✍️</span>توقيع المستلم / Signature</div>{viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border-2 border-slate-100 rounded-xl h-32 object-contain bg-slate-50"/> : <div className="h-32 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-slate-400"><div className="text-2xl">✍️</div><div className="text-xs font-bold mt-1">لا يوجد توقيع</div></div>}</div>
              <div className="bg-white border-2 border-slate-100 rounded-2xl p-4"><div className="text-xs font-black mb-3 flex items-center gap-2"><span className="w-6 h-6 bg-emerald-600 text-white rounded-lg flex items-center justify-center">📸</span>إثبات الاستلام / Proof</div>{viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border-2 border-slate-100 rounded-xl h-32 object-contain bg-slate-50"/> : <div className="h-32 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-slate-400"><div className="text-2xl">📸</div><div className="text-xs font-bold mt-1">لا يوجد إثبات</div></div>}</div>
            </div>

            <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 flex justify-between text-[11px] font-bold text-slate-600">
              <div><div className="text-slate-400 text-[10px] tracking-widest">تاريخ الإنشاء</div><div className="mt-1">{viewDocRec.created_at ? new Date(viewDocRec.created_at).toLocaleString('ar-EG') : '---'}</div></div>
              <div className="text-right"><div className="text-slate-400 text-[10px] tracking-widest">تاريخ التأكيد</div><div className="mt-1 text-emerald-700">{viewDocRec.confirmed_at ? new Date(viewDocRec.confirmed_at).toLocaleString('ar-EG') : 'لم يتم بعد'}</div></div>
            </div>
            <div className="text-center text-[10px] font-bold text-slate-400 mt-6 p-3 bg-slate-50 rounded-xl border">🔒 {T.ar.legalFooter} - {viewDocRec.id} • هيبة الاسترخاء</div>
          </div>

          <div className="p-5 bg-slate-50 border-t-2 border-slate-100 flex gap-3 no-print">
            <button onClick={()=>window.print()} className="flex-1 bg-slate-900 hover:bg-black text-white p-4 rounded-xl font-black shadow-lg hover:shadow-xl transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2">🖨️ {T[lang]?.print||'طباعة الوثيقة'}</button>
            <button onClick={()=>{document.getElementById('modal').style.display='none'; setViewDocRec(null);}} className="flex-1 bg-white border-2 border-slate-200 hover:bg-slate-50 p-4 rounded-xl font-black transition">إغلاق ✕</button>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
