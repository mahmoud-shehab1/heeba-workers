<!DOCTYPE html>

<head>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>

</head>
<body class="bg-[#f8fafc]">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const SUPABASE_URL = 'https://rbaqvnjardojbhyajkrb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYXF2bmphcmRvamJoeWFqa3JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTA1NDUsImV4cCI6MjEwNDYyNjU0NX0.tq4qnsOsyVeFyzkgBbcDEWJvng-6vrQFeez6DaMG0d4';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const T={ ar:{dec:"أقر أنا {name} هوية {id} بأنني استلمت من {shop} مبلغ {amount} {curr} مقابل {reason} عن طريق {method} بتاريخ {date}"}, id:{dec:"Saya {name} ID {id} telah menerima dari {shop} sejumlah {amount} {curr} untuk {reason} via {method} tanggal {date}."}, tl:{dec:"Ako si {name} ID {id} ay tumanggap mula sa {shop} ng {amount} {curr} para sa {reason} via {method} noong {date}."}, bn:{dec:"আমি {name} আইডি {id} {shop} থেকে {amount} {curr} {reason} এর জন্য {method} মাধ্যমে {date} তারিখে গ্রহণ করেছি।"} };
function formatDec(tmpl,r){ return tmpl.replace('{name}',r.receiver_name||'').replace('{id}',r.receiver_id||'---').replace('{shop}',r.shop_name||'هيبة الاسترخاء').replace('{amount}',r.amount||'').replace('{curr}',r.currency||'').replace('{reason}',r.reason||'').replace('{method}',r.method||'').replace('{date}',r.date||''); }
function SignaturePad({onSave}){
  const canvasRef=useRef(null); const [isDrawing,setIsDrawing]=useState(false);
  useEffect(()=>{ const c=canvasRef.current; if(!c) return; const ctx=c.getContext('2d'); ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.strokeStyle='#0f172a'; const getPos=(e)=>{const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left,y:t.clientY-rect.top};}; const start=(e)=>{setIsDrawing(true); const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);}; const move=(e)=>{if(!isDrawing)return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke();}; const end=()=>setIsDrawing(false); c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); c.addEventListener('mouseup',end); c.addEventListener('touchstart',(e)=>{e.preventDefault(); start(e)},{passive:false}); c.addEventListener('touchmove',(e)=>{e.preventDefault(); move(e)},{passive:false}); c.addEventListener('touchend',end); return ()=>{c.removeEventListener('mousedown',start); c.removeEventListener('mousemove',move); c.removeEventListener('mouseup',end);}; },[isDrawing]);
  const clear=()=>{const c=canvasRef.current; c.getContext('2d').clearRect(0,0,c.width,c.height); onSave('');}; const save=()=>{const data=canvasRef.current.toDataURL(); if(data.length<1500){alert('وقع أولاً');return;} onSave(data);};
  return (<div><canvas ref={canvasRef} width="600" height="180" className="sig-canvas w-full"></canvas><div className="flex gap-2 mt-3"><button onClick={clear} className="px-4 py-2 bg-slate-100 rounded-xl text-sm font-bold">🗑️ مسح</button><button onClick={save} className="px-4 py-2 bg-teal-600 text-white rounded-xl text-sm font-bold">💾 حفظ</button></div></div>);
}
function App(){
  const [user,setUser]=useState(()=>{ const saved=localStorage.getItem('heeba_session'); if(saved){ try{ return JSON.parse(saved); }catch(e){} } return null; });
  const [employees,setEmployees]=useState([]); const [receipts,setReceipts]=useState([]);
  const [loginU,setLoginU]=useState(''); const [loginP,setLoginP]=useState('');
  const [selectedEmp,setSelectedEmp]=useState(null); const [temp,setTemp]=useState({}); const [search,setSearch]=useState(''); const [filterStatus,setFilterStatus]=useState('all'); const [viewDocRec,setViewDocRec]=useState(null);
  const [editEmp,setEditEmp]=useState(null); // الموظف المراد تعديله
  const [editForm,setEditForm]=useState({name:'',username:'',password:'',nid:'',phone:'',job:'',lang:'ar'});
  const [eForm,setEForm]=useState({name:'',username:'',password:'',nid:'',phone:'',job:'',lang:'ar'});
  const [rForm,setRForm]=useState({shop:'هيبة الاسترخاء',emp:'',amount:'',curr:'ريال سعودي',reason:'',method:'نقداً',date:new Date().toISOString().split('T')[0],notes:''});

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{ if(user){ localStorage.setItem('heeba_session', JSON.stringify(user)); } else { localStorage.removeItem('heeba_session'); } },[user]);

  async function loadData(){
    const {data: emps} = await supabase.from('employees').select('*').order('created_at',{ascending:false});
    const {data: recs} = await supabase.from('receipts').select('*').order('created_at',{ascending:false});
    if(emps) setEmployees(emps);
    if(recs) setReceipts(recs);
  }
  async function doLogin(){
    if(loginU==='هيبة الاسترخاء' && loginP==='123123'){ setUser({role:'manager'}); return; }
    const {data} = await supabase.from('employees').select('*').eq('username',loginU).eq('password',loginP).single();
    if(data){ setUser({role:'employee', data:data}); } else { alert('❌ بيانات خاطئة'); }
  }
  function doLogout(){ localStorage.removeItem('heeba_session'); setUser(null); setViewDocRec(null); setEditEmp(null); }

  async function addEmployee(){
    if(!eForm.name||!eForm.username||!eForm.password){alert('املأ الحقول');return;}
    const newEmp={id:'EMP-'+Math.floor(1000+Math.random()*9000), name:eForm.name, username:eForm.username, password:eForm.password, national_id:eForm.nid, phone:eForm.phone, job:eForm.job, language:eForm.lang};
    const {data, error}=await supabase.from('employees').insert(newEmp).select();
    if(error){alert(error.message);return;} setEmployees([data[0],...employees]); setEForm({name:'',username:'',password:'',nid:'',phone:'',job:'',lang:'ar'});
  }

  // فتح نافذة التعديل
  function openEditEmployee(emp){
    setEditEmp(emp);
    setEditForm({name:emp.name, username:emp.username, password:emp.password, nid:emp.national_id||'', phone:emp.phone||'', job:emp.job||'', lang:emp.language||'ar'});
  }

  // حفظ التعديل
  async function saveEditEmployee(){
    if(!editForm.name||!editForm.username||!editForm.password){alert('الاسم واسم المستخدم وكلمة المرور مطلوبة');return;}
    const {data, error} = await supabase.from('employees').update({
      name: editForm.name,
      username: editForm.username,
      password: editForm.password,
      national_id: editForm.nid,
      phone: editForm.phone,
      job: editForm.job,
      language: editForm.lang
    }).eq('id', editEmp.id).select();
    if(error){alert(error.message);return;}
    setEmployees(prev=>prev.map(e=>e.id===editEmp.id? data[0] : e));
    setEditEmp(null);
    alert('✅ تم تعديل بيانات الموظف بنجاح');
  }

  async function deleteEmployee(id){
    if(!confirm('هل أنت متأكد من حذف الموظف؟ سيتم حذف إيصالاته أيضاً من العرض')) return;
    const emp = employees.find(e=>e.id===id);
    const {error}=await supabase.from('employees').delete().eq('id',id);
    if(error){alert(error.message);return;}
    setEmployees(prev=>prev.filter(e=>e.id!==id));
    // لا نحذف الإيصالات من قاعدة البيانات للحفاظ على السجل، لكن نخفيها من العرض إذا أردت احذفها أيضاً
    if(selectedEmp?.id===id) setSelectedEmp(null);
  }

  async function createReceipt(){
    if(!rForm.emp||!rForm.amount||!rForm.reason){alert('أكمل البيانات');return;}
    const emp=employees.find(e=>e.username===rForm.emp);
    const rec={id:'REC-'+new Date().getFullYear()+'-'+Math.floor(1000+Math.random()*9000), shop_name:rForm.shop, receiver_name:emp.name, receiver_username:emp.username, receiver_id:emp.national_id, amount:parseFloat(rForm.amount), currency:rForm.curr, reason:rForm.reason, method:rForm.method, date:rForm.date, notes:rForm.notes, status:'pending', language:emp.language};
    const {data, error}=await supabase.from('receipts').insert(rec).select();
    if(error){alert(error.message);return;} setReceipts([data[0],...receipts]); setRForm({...rForm,amount:'',reason:'',notes:''});
  }
  async function deleteReceipt(id){ if(!confirm('حذف الإيصال؟')) return; const {error}=await supabase.from('receipts').delete().eq('id',id); if(error){alert(error.message);return;} setReceipts(prev=>prev.filter(r=>r.id!==id)); }
  function handleEvidence(e, recId){ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=(ev)=>{setTemp(prev=>({...prev,[recId]:{...prev[recId], evidence:ev.target.result}}));}; reader.readAsDataURL(file); }
  async function confirmReceipt(recId){ const t=temp[recId]; if(!t?.checked||!t?.evidence||!t?.signature){alert('أكمل الإقرار والصورة والتوقيع');return;} const {error}=await supabase.from('receipts').update({status:'confirmed', confirmed_at:new Date().toISOString(), evidence_url:t.evidence, signature_url:t.signature}).eq('id',recId); if(error){alert(error.message);return;} setReceipts(prev=>prev.map(r=>r.id===recId?{...r,status:'confirmed', evidence_url:t.evidence, signature_url:t.signature, confirmed_at:new Date().toISOString()}:r)); alert('✅ تم التأكيد'); }

  if(!user){
    return (<div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-teal-600 to-emerald-600"><div className="bg-white p-10 rounded-[32px] shadow-2xl w-full max-w-md"><div className="w-20 h-20 bg-teal-700 rounded-[20px] flex items-center justify-center mx-auto mb-6 text-white text-3xl">🏢</div><h1 className="text-3xl font-black text-center">هيبة الاسترخاء</h1><div className="mt-8 space-y-4"><input value={loginU} onChange={e=>setLoginU(e.target.value)} className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold" placeholder="اسم المستخدم"/><input type="password" value={loginP} onChange={e=>setLoginP(e.target.value)} className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold" placeholder="كلمة المرور"/><button onClick={doLogin} className="w-full bg-teal-700 text-white p-4 rounded-2xl font-black">دخول ✨</button></div></div></div>);
  }

  if(user.role==='manager'){
    const filteredReceipts = receipts.filter(r=>{ if(filterStatus!=='all' && r.status!==filterStatus) return false; if(search && !(r.receiver_name?.toLowerCase().includes(search.toLowerCase()) || r.id?.toLowerCase().includes(search.toLowerCase()))) return false; return true; });
    return (
      <div className="min-h-screen bg-[#f8fafc]">
        <div className="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-20"><b>👔 لوحة تحكم المدير</b><button onClick={doLogout} className="px-5 py-2.5 bg-red-50 text-red-700 rounded-xl font-bold">خروج</button></div>
        <div className="max-w-7xl mx-auto p-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-[24px] border"><h3 className="font-black">➕ إضافة موظف</h3><div className="mt-4 space-y-3"><input value={eForm.name} onChange={e=>setEForm({...eForm,name:e.target.value})} placeholder="اسم الموظف" className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold"/><div className="grid grid-cols-2 gap-3"><input value={eForm.username} onChange={e=>setEForm({...eForm,username:e.target.value})} placeholder="اسم المستخدم" className="p-3.5 bg-slate-50 border rounded-xl font-bold"/><input value={eForm.password} onChange={e=>setEForm({...eForm,password:e.target.value})} placeholder="كلمة المرور" className="p-3.5 bg-slate-50 border rounded-xl font-bold"/></div><div className="grid grid-cols-2 gap-3"><input value={eForm.nid} onChange={e=>setEForm({...eForm,nid:e.target.value})} placeholder="رقم الهوية" className="p-3.5 bg-slate-50 border rounded-xl font-bold"/><input value={eForm.phone} onChange={e=>setEForm({...eForm,phone:e.target.value})} placeholder="الجوال" className="p-3.5 bg-slate-50 border rounded-xl font-bold"/></div><input value={eForm.job} onChange={e=>setEForm({...eForm,job:e.target.value})} placeholder="الوظيفة" className="w-full p-3.5 bg-slate-50 border rounded-xl font-bold"/><select value={eForm.lang} onChange={e=>setEForm({...eForm,lang:e.target.value})} className="w-full p-3.5 bg-slate-50 border rounded-xl font-bold"><option value="ar">🇸🇦 عربي</option><option value="id">🇮🇩 Indonesia</option><option value="tl">🇵🇭 Filipino</option><option value="bn">🇧🇩 Bengali</option></select><button onClick={addEmployee} className="w-full bg-teal-700 text-white p-4 rounded-xl font-black">حفظ الموظف ✨</button></div></div>
              <div className="bg-white p-6 rounded-[24px] border"><h3 className="font-black">➕ إنشاء إيصال</h3><div className="space-y-3 mt-4"><select value={rForm.emp} onChange={e=>setRForm({...rForm,emp:e.target.value})} className="w-full p-3.5 bg-slate-50 border rounded-xl font-bold"><option value="">اختر الموظف</option>{employees.map(emp=><option key={emp.id} value={emp.username}>{emp.name} - {emp.language}</option>)}</select><div className="grid grid-cols-2 gap-3"><input type="number" value={rForm.amount} onChange={e=>setRForm({...rForm,amount:e.target.value})} placeholder="المبلغ" className="p-3.5 bg-slate-50 border rounded-xl font-black"/><select value={rForm.curr} onChange={e=>setRForm({...rForm,curr:e.target.value})} className="p-3.5 bg-slate-50 border rounded-xl font-bold"><option>ريال سعودي</option><option>جنيه مصري</option></select></div><input value={rForm.reason} onChange={e=>setRForm({...rForm,reason:e.target.value})} placeholder="السبب" className="w-full p-3.5 bg-slate-50 border rounded-xl font-bold"/><div className="grid grid-cols-2 gap-3"><select value={rForm.method} onChange={e=>setRForm({...rForm,method:e.target.value})} className="p-3.5 bg-slate-50 border rounded-xl font-bold"><option>نقداً</option><option>تحويل بنكي</option><option>STC Pay</option></select><input type="date" value={rForm.date} onChange={e=>setRForm({...rForm,date:e.target.value})} className="p-3.5 bg-slate-50 border rounded-xl font-bold"/></div><button onClick={createReceipt} className="w-full bg-slate-900 text-white p-4 rounded-xl font-black">إنشاء 🚀</button></div></div>
            </div>
            <div className="lg:col-span-2">
              <div className="bg-white p-6 rounded-[24px] border">
                <h3 className="font-black mb-4">👥 فريق العمل ({employees.length}) - تعديل وحذف</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {employees.map(emp=>(
                    <div key={emp.id} className="p-4 rounded-2xl border-2 border-slate-100 bg-white hover:border-slate-200 transition">
                      <div className="flex justify-between"><div className="w-10 h-10 bg-teal-700 text-white rounded-xl flex items-center justify-center font-black">{emp.name.charAt(0)}</div><span className="text-xs bg-slate-900 text-white px-2 py-1 rounded-full h-fit">{emp.language.toUpperCase()}</span></div>
                      <div className="font-black mt-2">{emp.name}</div>
                      <div className="text-xs text-slate-500">@{emp.username} • {emp.job} • {emp.phone}</div>
                      <div className="text-[11px] text-slate-400 mt-1">🪪 {emp.national_id||'---'}</div>
                      <div className="flex gap-2 mt-3">
                        <button onClick={()=>openEditEmployee(emp)} className="flex-1 px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-xl text-xs font-black">✏️ تعديل</button>
                        <button onClick={()=>deleteEmployee(emp.id)} className="flex-1 px-3 py-2 bg-red-50 hover:bg-red-100 text-red-700 rounded-xl text-xs font-black">🗑️ حذف</button>
                        <button onClick={()=>setSelectedEmp(selectedEmp?.id===emp.id?null:emp)} className="px-3 py-2 bg-slate-50 hover:bg-slate-100 rounded-xl text-xs font-black">👁️</button>
                      </div>
                    </div>
                  ))}
                </div>
                {employees.length===0 && <div className="text-center py-10 text-slate-400">لا يوجد موظفون</div>}
              </div>
              <div className="bg-white p-6 rounded-[24px] border mt-6">
                <div className="flex justify-between mb-4"><h3 className="font-black">📑 الإيصالات ({filteredReceipts.length})</h3><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." className="p-2 bg-slate-50 border rounded-xl text-sm w-28"/><select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="p-2 bg-slate-50 border rounded-xl text-sm"><option value="all">الكل</option><option value="pending">معلق</option><option value="confirmed">مؤكد</option></select></div></div>
                <div className="overflow-x-auto rounded-xl border"><table className="w-full text-sm"><thead><tr className="bg-slate-50"><th className="p-3 text-right">الرقم</th><th>الموظف</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>{filteredReceipts.map(r=><tr key={r.id} className="border-t"><td className="p-3 font-mono text-xs">{r.id}</td><td className="p-3 font-bold">{r.receiver_name}</td><td className="p-3 font-black text-teal-700">{r.amount}</td><td className="p-3">{r.status==='pending'?<span className="px-2 py-1 bg-amber-500 text-white rounded-full text-xs">معلق</span>:<span className="px-2 py-1 bg-emerald-500 text-white rounded-full text-xs">مؤكد</span>}</td><td className="p-3 flex gap-1"><button onClick={()=>setViewDocRec(r)} className="px-3 py-1 bg-slate-900 text-white rounded-xl text-xs">عرض</button><button onClick={()=>deleteReceipt(r.id)} className="px-2 py-1 bg-red-50 text-red-600 rounded-xl text-xs">🗑️</button></td></tr>)}</tbody></table></div>
              </div>
            </div>
          </div>
        </div>

        {/* نافذة تعديل الموظف */}
        {editEmp && (
          <div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget){setEditEmp(null)}}}>
            <div className="bg-white max-w-lg w-full rounded-[24px] p-6 shadow-2xl">
              <div className="flex justify-between items-center mb-6"><h3 className="font-black text-lg">✏️ تعديل بيانات الموظف</h3><button onClick={()=>setEditEmp(null)} className="w-8 h-8 bg-slate-100 rounded-full">✕</button></div>
              <div className="space-y-3">
                <div><label className="text-xs font-black">اسم الموظف</label><input value={editForm.name} onChange={e=>setEditForm({...editForm,name:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div>
                <div className="grid grid-cols-2 gap-3"><div><label className="text-xs font-black">اسم المستخدم</label><input value={editForm.username} onChange={e=>setEditForm({...editForm,username:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div><div><label className="text-xs font-black">كلمة المرور</label><input value={editForm.password} onChange={e=>setEditForm({...editForm,password:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div></div>
                <div className="grid grid-cols-2 gap-3"><div><label className="text-xs font-black">رقم الهوية</label><input value={editForm.nid} onChange={e=>setEditForm({...editForm,nid:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div><div><label className="text-xs font-black">الجوال</label><input value={editForm.phone} onChange={e=>setEditForm({...editForm,phone:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div></div>
                <div className="grid grid-cols-2 gap-3"><div><label className="text-xs font-black">الوظيفة</label><input value={editForm.job} onChange={e=>setEditForm({...editForm,job:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"/></div><div><label className="text-xs font-black">لغة العامل</label><select value={editForm.lang} onChange={e=>setEditForm({...editForm,lang:e.target.value})} className="w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold mt-1"><option value="ar">🇸🇦 عربي</option><option value="id">🇮🇩 Indonesia</option><option value="tl">🇵🇭 Filipino</option><option value="bn">🇧🇩 Bengali</option></select></div></div>
                <div className="flex gap-3 mt-6"><button onClick={saveEditEmployee} className="flex-1 bg-teal-700 text-white p-4 rounded-xl font-black">💾 حفظ التعديلات</button><button onClick={()=>setEditEmp(null)} className="flex-1 bg-slate-100 p-4 rounded-xl font-black">إلغاء</button></div>
                <div className="text-[11px] text-slate-400 text-center mt-2">بعد التعديل، الموظف يقدر يدخل بالبيانات الجديدة فوراً</div>
              </div>
            </div>
          </div>
        )}

        {viewDocRec && (
          <div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget){setViewDocRec(null)}}}>
            <div className="bg-white max-w-2xl w-full rounded-[24px] overflow-hidden shadow-2xl max-h-[90vh] overflow-y-auto">
              <div id="printable-doc" className="p-8">
                <div className="text-center border-b-2 border-slate-900 pb-4 mb-6"><div className="w-14 h-14 bg-teal-700 rounded-2xl flex items-center justify-center mx-auto text-white">📜</div><h2 className="text-xl font-black mt-3">إقرار استلام</h2><div className="mt-2 font-mono text-xs bg-slate-900 text-white inline-block px-4 py-1 rounded-full">{viewDocRec.id}</div></div>
                <div className="bg-teal-50 p-4 rounded-2xl border mb-4"><div className="font-black text-sm mb-2">النص بلغته:</div><div className="text-sm bg-white p-4 rounded-xl border">{formatDec(T[viewDocRec.language||'ar']?.dec||T.ar.dec, viewDocRec)}</div></div>
                <table className="w-full border text-sm mb-4"><tr><td className="p-3 bg-slate-50 font-bold">المستلم</td><td className="p-3">{viewDocRec.receiver_name}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">المبلغ</td><td className="p-3 font-black text-xl text-teal-700">{viewDocRec.amount} {viewDocRec.currency}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">السبب</td><td className="p-3">{viewDocRec.reason}</td></tr></table>
                <div className="grid grid-cols-2 gap-4 mb-4"><div><div className="text-xs font-black mb-2">✍️ التوقيع:</div>{viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div><div><div className="text-xs font-black mb-2">📸 الإثبات:</div>{viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div></div>
              </div>
              <div className="p-4 bg-slate-50 border-t flex gap-3"><button onClick={()=>window.print()} className="flex-1 bg-slate-900 text-white p-3 rounded-xl font-black">🖨️ طباعة</button><button onClick={()=>setViewDocRec(null)} className="flex-1 bg-white border-2 p-3 rounded-xl font-black">إغلاق</button></div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const emp=user.data; const lang=emp.language||'ar'; const myRecs=receipts.filter(r=>r.receiver_username===emp.username); const pending=myRecs.filter(r=>r.status==='pending'); const confirmed=myRecs.filter(r=>r.status==='confirmed');
  return (
    <div className="min-h-screen bg-[#f8fafc]">
      <div className="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-20"><b>👋 أهلاً {emp.name}</b><button onClick={doLogout} className="px-4 py-2 bg-red-50 text-red-700 rounded-xl font-bold">خروج</button></div>
      <div className="max-w-4xl mx-auto p-5">
        {pending.map(r=>{ const decLang=formatDec(T[lang]?.dec||T.ar.dec,r); const t=temp[r.id]||{}; return (<div key={r.id} className="bg-white p-6 rounded-[24px] border-2 border-amber-200 shadow-lg mb-6"><div className="flex justify-between"><b>هيبة الاسترخاء</b><span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{r.id}</span></div><div className="text-3xl font-black text-teal-700 my-3">{r.amount} {r.currency}</div><div className="mt-4 bg-amber-50 p-4 rounded-2xl border"><label className="flex gap-2"><input type="checkbox" onChange={e=>setTemp(prev=>({...prev,[r.id]:{...prev[r.id],checked:e.target.checked}}))}/> <span className="font-black text-sm">أقر أنني استلمت المبلغ</span></label><div className="mt-3 p-3 bg-white rounded-xl text-sm font-bold">{decLang}</div></div><div className="mt-4"><label className="font-black text-sm">📸 تصوير إثبات</label><input type="file" accept="image/*" capture="environment" onChange={e=>handleEvidence(e,r.id)} className="w-full p-4 bg-slate-50 border-2 border-dashed rounded-2xl mt-2"/><div className="mt-3">{t.evidence&&<img src={t.evidence} className="w-full max-h-72 object-contain border rounded-2xl"/>}</div></div><div className="mt-4"><label className="font-black text-sm">✍️ توقيعك</label><div className="mt-2"><SignaturePad onSave={(sig)=>setTemp(prev=>({...prev,[r.id]:{...prev[r.id],signature:sig}}))}/></div></div><button disabled={!(t.checked&&t.evidence&&t.signature)} onClick={()=>confirmReceipt(r.id)} className="w-full bg-teal-700 text-white p-4 rounded-xl mt-4 font-black disabled:opacity-40">تأكيد ✅</button></div>); })}
        <div className="bg-white rounded-[24px] border overflow-hidden mt-6"><div className="p-5 border-b"><h3 className="font-black">📊 سجل الاستلامات ({confirmed.length})</h3></div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-slate-50 text-[11px] font-black"><th className="p-4 text-right">رقم الإيصال</th><th>المبلغ</th><th>السبب</th><th>التاريخ</th><th>الوثيقة</th></tr></thead><tbody>{confirmed.map(r=><tr key={r.id} className="border-t"><td className="p-4 font-mono text-xs">{r.id}</td><td className="p-4 font-black text-teal-700">{r.amount}</td><td className="p-4">{r.reason}</td><td className="p-4 text-xs">{r.date}</td><td className="p-4"><button onClick={()=>setViewDocRec(r)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black">عرض</button></td></tr>)}</tbody></table></div></div>
      </div>
      {viewDocRec && (<div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget){setViewDocRec(null)}}}> <div className="bg-white max-w-2xl w-full rounded-[24px] overflow-hidden shadow-2xl max-h-[90vh] overflow-y-auto"><div id="printable-doc" className="p-8"><div className="text-center border-b-2 border-slate-900 pb-4 mb-6"><div className="w-14 h-14 bg-teal-700 rounded-2xl flex items-center justify-center mx-auto text-white">📜</div><h2 className="text-xl font-black mt-3">إقرار استلام</h2><div className="mt-2 font-mono text-xs bg-slate-900 text-white inline-block px-4 py-1 rounded-full">{viewDocRec.id}</div></div><table className="w-full border text-sm mb-4"><tr><td className="p-3 bg-slate-50 font-bold">المستلم</td><td className="p-3">{viewDocRec.receiver_name}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">المبلغ</td><td className="p-3 font-black text-xl text-teal-700">{viewDocRec.amount} {viewDocRec.currency}</td></tr></table><div className="grid grid-cols-2 gap-4 mb-4"><div><div className="text-xs font-black mb-2">✍️ التوقيع:</div>{viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div><div><div className="text-xs font-black mb-2">📸 الإثبات:</div>{viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div></div></div><div className="p-4 bg-slate-50 border-t flex gap-3"><button onClick={()=>window.print()} className="flex-1 bg-slate-900 text-white p-3 rounded-xl font-black">🖨️ طباعة</button><button onClick={()=>setViewDocRec(null)} className="flex-1 bg-white border-2 p-3 rounded-xl font-black">إغلاق</button></div></div></div>)}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
