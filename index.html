function formatDec(tmpl,r){
  if(!tmpl) return '';
  return tmpl.replace('{name}',r.receiver_name||r.receiverName||'').replace('{id}',r.receiver_id||r.receiverId||'---').replace('{shop}',r.shop_name||r.shopName||'هيبة الاسترخاء').replace('{amount}',r.amount||'').replace('{curr}',r.currency||'').replace('{reason}',r.reason||'').replace('{method}',r.method||'').replace('{date}',r.date||'');
}

function SignaturePad({onSave}){
  const canvasRef=useRef(null);
  const [isDrawing,setIsDrawing]=useState(false);
  useEffect(()=>{
    const c=canvasRef.current; if(!c) return;
    const ctx=c.getContext('2d'); ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.strokeStyle='#0f172a';
    const getPos=(e)=>{const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left, y:t.clientY-rect.top};};
    const start=(e)=>{setIsDrawing(true); const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);};
    const move=(e)=>{if(!isDrawing)return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke();};
    const end=()=>setIsDrawing(false);
    c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); c.addEventListener('mouseup',end);
    c.addEventListener('touchstart',(e)=>{e.preventDefault(); start(e)},{passive:false});
    c.addEventListener('touchmove',(e)=>{e.preventDefault(); move(e)},{passive:false});
    c.addEventListener('touchend',end);
    return ()=>{c.removeEventListener('mousedown',start); c.removeEventListener('mousemove',move); c.removeEventListener('mouseup',end);};
  },[isDrawing]);
  const clear=()=>{const c=canvasRef.current; c.getContext('2d').clearRect(0,0,c.width,c.height); onSave('');};
  const save=()=>{const data=canvasRef.current.toDataURL(); if(data.length<1500){alert('وقع أولاً');return;} onSave(data);};
  return (<div><canvas ref={canvasRef} width="600" height="180" className="sig-canvas w-full"></canvas><div className="flex gap-2 mt-3"><button onClick={clear} className="px-4 py-2 bg-slate-100 rounded-xl text-sm font-bold">🗑️ مسح</button><button onClick={save} className="px-4 py-2 bg-teal-600 text-white rounded-xl text-sm font-bold">💾 حفظ التوقيع</button></div></div>);
}

                <div className="overflow-x-auto rounded-xl border"><table className="w-full text-sm"><thead><tr className="bg-slate-50"><th className="p-3 text-right">الرقم</th><th>الموظف</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>{filteredReceipts.map(r=><tr key={r.id} className="border-t"><td className="p-3 font-mono text-xs">{r.id}</td><td className="p-3 font-bold">{r.receiver_name}</td><td className="p-3 font-black text-teal-700">{r.amount}</td><td className="p-3">{r.status==='pending'?<span className="px-2 py-1 bg-amber-500 text-white rounded-full text-xs">معلق</span>:<span className="px-2 py-1 bg-emerald-500 text-white rounded-full text-xs">مؤكد</span>}</td><td className="p-3 flex gap-1"><button onClick={()=>setViewDocRec(r)} className="px-3 py-1 bg-slate-900 text-white rounded-xl text-xs">عرض</button><button onClick={()=>deleteReceipt(r.id)} className="px-2 py-1 bg-red-50 text-red-600 rounded-xl text-xs">🗑️</button></td></tr>)}</tbody></table></div>
              </div>
            </div>
          </div>
        </div>

        {viewDocRec && (
          <div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget){setViewDocRec(null)}}}>
            <div className="bg-white max-w-2xl w-full rounded-[24px] overflow-hidden shadow-2xl max-h-[90vh] overflow-y-auto">
              <div id="printable-doc" className="p-8">
                <div className="text-center border-b-2 border-slate-900 pb-4 mb-6"><div className="w-14 h-14 bg-teal-700 rounded-2xl flex items-center justify-center mx-auto text-white text-xl">📜</div><h2 className="text-xl font-black mt-3">إقرار استلام - وثيقة قانونية</h2><div className="mt-2 font-mono text-xs bg-slate-900 text-white inline-block px-4 py-1 rounded-full">{viewDocRec.id}</div></div>
                <div className="bg-teal-50 p-4 rounded-2xl border-2 border-teal-100 mb-4"><div className="font-black text-sm mb-2">النص بلغته ({viewDocRec.language}):</div><div className="text-sm leading-7 font-bold bg-white p-4 rounded-xl border">{formatDec(T[viewDocRec.language||'ar']?.dec||T.ar.dec, viewDocRec)}</div></div>
                <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 mb-4"><div className="font-black text-sm mb-2">🇸🇦 النص العربي الأصلي:</div><div className="text-xs leading-7 bg-white p-4 rounded-xl border">{formatDec(T.ar.dec, viewDocRec)}</div></div>
                <table className="w-full border text-sm mb-4"><tr><td className="p-3 bg-slate-50 font-bold w-32">المستلم</td><td className="p-3">{viewDocRec.receiver_name}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">المبلغ</td><td className="p-3 font-black text-xl text-teal-700">{viewDocRec.amount} {viewDocRec.currency}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">السبب</td><td className="p-3">{viewDocRec.reason} - {viewDocRec.method} - {viewDocRec.date}</td></tr></table>
                <div className="grid grid-cols-2 gap-4 mb-4"><div><div className="text-xs font-black mb-2">✍️ التوقيع:</div>{viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div><div><div className="text-xs font-black mb-2">📸 الإثبات:</div>{viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div></div>
                <div className="flex justify-between text-[11px] text-slate-500 border-t pt-3"><span>إنشاء: {viewDocRec.created_at ? new Date(viewDocRec.created_at).toLocaleString('ar-EG') : ''}</span><span>تأكيد: {viewDocRec.confirmed_at ? new Date(viewDocRec.confirmed_at).toLocaleString('ar-EG') : '---'}</span></div>
              </div>
              <div className="p-4 bg-slate-50 border-t flex gap-3 no-print"><button onClick={()=>window.print()} className="flex-1 bg-slate-900 text-white p-3 rounded-xl font-black">🖨️ طباعة الوثيقة</button><button onClick={()=>setViewDocRec(null)} className="flex-1 bg-white border-2 border-slate-200 p-3 rounded-xl font-black">إغلاق</button></div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const emp=user.data; const lang=emp.language||'ar'; const tr=T[lang]||T.ar;
  const myRecs=receipts.filter(r=>r.receiver_username===emp.username); const pending=myRecs.filter(r=>r.status==='pending'); const confirmed=myRecs.filter(r=>r.status==='confirmed');
  return (
    <div className="min-h-screen bg-[#f8fafc]">
      <div className="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-20"><b>👋 {tr.welcome} {emp.name}</b><button onClick={doLogout} className="px-4 py-2 bg-red-50 text-red-700 rounded-xl font-bold">خروج</button></div>
      <div className="max-w-4xl mx-auto p-5">
        {pending.length>0 && (
          <div className="mb-8">
            <h3 className="font-black text-lg mb-4">📥 {tr.pendingTitle} ({pending.length})</h3>
            {pending.map(r=>{
              const decLang=formatDec(T[lang]?.dec||T.ar.dec,r); const decAr=formatDec(T.ar.dec,r); const t=temp[r.id]||{};
              return (
                <div key={r.id} className="bg-white p-6 rounded-[24px] border-2 border-amber-200 shadow-lg mb-6">
                  <div className="flex justify-between"><b>هيبة الاسترخاء</b><span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded">{r.id}</span></div>
                  <div className="text-3xl font-black text-teal-700 my-3">{r.amount} {r.currency}</div>
                  <div className="text-sm text-slate-600">{r.reason} • {r.method} • {r.date}</div>
                  <div className="mt-4 bg-amber-50 p-4 rounded-2xl border"><label className="flex gap-2 cursor-pointer"><input type="checkbox" onChange={e=>setTemp(prev=>({...prev,[r.id]:{...prev[r.id],checked:e.target.checked}}))}/> <span className="font-black text-sm">{tr.ack}</span></label><div className="mt-3 p-3 bg-white rounded-xl text-sm font-bold">{decLang}</div><div className="mt-2 text-[11px] text-slate-500">AR: {decAr}</div></div>
                  <div className="mt-4"><label className="font-black text-sm">{tr.proof}</label><input type="file" accept="image/*" capture="environment" onChange={e=>handleEvidence(e,r.id)} className="w-full p-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl mt-2"/><div className="mt-3">{t.evidence&&<img src={t.evidence} className="w-full max-h-72 object-contain border-2 border-emerald-200 rounded-2xl"/>}</div></div>
                  <div className="mt-4"><label className="font-black text-sm">{tr.sign}</label><div className="mt-2"><SignaturePad onSave={(sig)=>setTemp(prev=>({...prev,[r.id]:{...prev[r.id],signature:sig}}))}/></div></div>
                  <button disabled={!(t.checked&&t.evidence&&t.signature)} onClick={()=>confirmReceipt(r.id)} className="w-full bg-teal-700 text-white p-4 rounded-xl mt-4 font-black disabled:opacity-40">{tr.confirm} ✅</button>
                </div>
              );
            })}
          </div>
        )}

        <div>
          <h3 className="font-black text-lg mb-4">📊 {tr.history} ({confirmed.length})</h3>
          <div className="bg-white rounded-[24px] border overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-slate-50 text-[11px] font-black"><th className="p-4 text-right">رقم الإيصال</th><th className="p-4 text-right">المبلغ</th><th className="p-4 text-right">السبب</th><th className="p-4 text-right">التاريخ</th><th className="p-4 text-right">الحالة</th><th className="p-4 text-right">الوثيقة</th></tr></thead>
                <tbody>
                  {confirmed.length===0 ? <tr><td colSpan="6" className="p-12 text-center text-slate-400">لا يوجد إيصالات مؤكدة</td></tr> :
                    confirmed.map(r=>(
                      <tr key={r.id} className="border-t hover:bg-slate-50">
                        <td className="p-4 font-mono text-xs font-black">{r.id}</td>
                        <td className="p-4 font-black text-teal-700">{r.amount} {r.currency}</td>
                        <td className="p-4">{r.reason}</td>
                        <td className="p-4 text-xs">{r.date}</td>
                        <td className="p-4"><span className="px-2 py-1 bg-emerald-500 text-white rounded-full text-xs">مؤكد</span></td>
                        <td className="p-4"><button onClick={()=>setViewDocRec(r)} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black">👁️ {tr.view}</button></td>
                      </tr>
                    ))
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      {viewDocRec && (
        <div className="modal-overlay" onClick={(e)=>{if(e.target===e.currentTarget){setViewDocRec(null)}}}>
          <div className="bg-white max-w-2xl w-full rounded-[24px] overflow-hidden shadow-2xl max-h-[90vh] overflow-y-auto">
            <div id="printable-doc" className="p-8">
              <div className="text-center border-b-2 border-slate-900 pb-4 mb-6"><div className="w-14 h-14 bg-teal-700 rounded-2xl flex items-center justify-center mx-auto text-white">📜</div><h2 className="text-xl font-black mt-3">{T[viewDocRec.language||lang]?.docTitle||'إقرار استلام'}</h2><div className="mt-2 font-mono text-xs bg-slate-900 text-white inline-block px-4 py-1 rounded-full">{viewDocRec.id}</div></div>
              <div className="bg-teal-50 p-4 rounded-2xl border-2 border-teal-100 mb-4"><div className="font-black text-sm mb-2">النص بلغته:</div><div className="text-sm leading-7 font-bold bg-white p-4 rounded-xl border">{formatDec(T[viewDocRec.language||'ar']?.dec||T.ar.dec, viewDocRec)}</div></div>
              <div className="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 mb-4"><div className="font-black text-sm mb-2">🇸🇦 النص العربي:</div><div className="text-xs leading-7 bg-white p-4 rounded-xl border">{formatDec(T.ar.dec, viewDocRec)}</div></div>
              <table className="w-full border text-sm mb-4"><tr><td className="p-3 bg-slate-50 font-bold w-32">المستلم</td><td className="p-3">{viewDocRec.receiver_name}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">المبلغ</td><td className="p-3 font-black text-xl text-teal-700">{viewDocRec.amount} {viewDocRec.currency}</td></tr><tr><td className="p-3 bg-slate-50 font-bold">السبب</td><td className="p-3">{viewDocRec.reason} - {viewDocRec.method} - {viewDocRec.date}</td></tr></table>
              <div className="grid grid-cols-2 gap-4 mb-4"><div><div className="text-xs font-black mb-2">✍️ التوقيع:</div>{viewDocRec.signature_url ? <img src={viewDocRec.signature_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div><div><div className="text-xs font-black mb-2">📸 الإثبات:</div>{viewDocRec.evidence_url ? <img src={viewDocRec.evidence_url} className="w-full border rounded-xl h-32 object-contain"/> : <div className="h-32 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-xs">لا يوجد</div>}</div></div>
              <div className="flex justify-between text-[11px] text-slate-500 border-t pt-3"><span>إنشاء: {viewDocRec.created_at ? new Date(viewDocRec.created_at).toLocaleString('ar-EG') : ''}</span><span>تأكيد: {viewDocRec.confirmed_at ? new Date(viewDocRec.confirmed_at).toLocaleString('ar-EG') : '---'}</span></div>
            </div>
            <div className="p-4 bg-slate-50 border-t flex gap-3 no-print"><button onClick={()=>window.print()} className="flex-1 bg-slate-900 text-white p-3 rounded-xl font-black">🖨️ {T[lang]?.print||'طباعة الوثيقة'}</button><button onClick={()=>setViewDocRec(null)} className="flex-1 bg-white border-2 border-slate-200 p-3 rounded-xl font-black">إغلاق</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
